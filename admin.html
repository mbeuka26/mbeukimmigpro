<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MbeukImmig Pro — Administration</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
body { font-family:'DM Sans',sans-serif; background:#f4f3ef; margin:0; padding:24px; color:#0d0d14; }
.card { background:#fff; border:1px solid #e2e0da; border-radius:12px; padding:20px; max-width:720px; margin:0 auto 16px; }
button { background:#1a3a5c; color:#fff; border:none; padding:10px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
pre { background:#f0f0f0; padding:12px; border-radius:8px; overflow:auto; font-size:.82rem; }
a { color:#c8440e; }
</style>
</head>
<body>
<div class="card">
  <h1>Administration</h1>
  <p>Accès réservé (<code>app_metadata.role = admin</code>).</p>
  <p><a href="./platform.html">← Plateforme</a></p>
  <button id="btnHealth">État des services</button>
  <button id="btnCrawl">Lancer collecte (limitée)</button>
  <pre id="out">—</pre>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';
import { callFunction } from './js/platform/api.js';

const cfg = await import('./js/supabase-config.js').catch(() => ({}));
const { configureSupabase } = await import('./js/platform/api.js');
if (cfg.SUPABASE_URL) configureSupabase(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
const supabase = cfg.SUPABASE_URL ? createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;
const out = document.getElementById('out');

if (!supabase) out.textContent = 'Configurez js/supabase-config.js';

document.getElementById('btnHealth').onclick = async () => {
  try { out.textContent = JSON.stringify(await callFunction(supabase, 'admin-health', {}), null, 2); }
  catch (e) { out.textContent = e.message; }
};

document.getElementById('btnCrawl').onclick = async () => {
  try { out.textContent = JSON.stringify(await callFunction(supabase, 'crawler', { limit: 1 }), null, 2); }
  catch (e) { out.textContent = e.message; }
};
</script>
</body>
</html>
